name: CAD export

on:
  push:
    paths: ["cad/**", "scripts/**", ".github/workflows/cad.yml"]
  pull_request:
    paths: ["cad/**"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: ./scripts/export_stl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sparky-stl
          path: stl/*.stl
