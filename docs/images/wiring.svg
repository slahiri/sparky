<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="560" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">Sparky wiring (all Dupont, no soldered joints)</text>
<!-- board -->
<rect x="290" y="60" width="180" height="400" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="380" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">ESP32-C3 SuperMini</text>
<text x="380" y="263" text-anchor="middle" font-size="12" fill="#5F5E5A">on expansion board</text>
<text x="380" y="281" text-anchor="middle" font-size="12" fill="#5F5E5A">USB-C, LiPo charger</text>
<g font-size="12" fill="#444441">
<text x="300" y="104">GPIO8 SDA</text><text x="300" y="134">GPIO9 SCL</text><text x="300" y="184">GPIO10 INT</text><text x="300" y="384">GPIO3 TOUCH</text>
<text x="460" y="104" text-anchor="end">BCLK GPIO4</text><text x="460" y="134" text-anchor="end">WS GPIO5</text><text x="460" y="164" text-anchor="end">DIN GPIO6</text><text x="460" y="334" text-anchor="end">SD GPIO7</text>
<text x="460" y="434" text-anchor="end">BAT +/-</text>
</g>
<!-- left modules -->
<g font-size="14" font-weight="bold">
<rect x="30" y="66" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="115" y="90" text-anchor="middle" fill="#085041">1.3" OLED</text>
<text x="115" y="108" text-anchor="middle" font-size="11" font-weight="normal" fill="#0F6E56">face groove, 0x3C</text>
<rect x="30" y="140" width="170" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="115" y="164" text-anchor="middle" fill="#085041">MPU-6050</text>
<text x="115" y="182" text-anchor="middle" font-size="11" font-weight="normal" fill="#0F6E56">plate top, 0x68</text>
<rect x="30" y="360" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B"/><text x="115" y="384" text-anchor="middle" fill="#633806">TTP223 touch</text>
<text x="115" y="400" text-anchor="middle" font-size="11" font-weight="normal" fill="#854F0B">lid, under the shell top</text>
</g>
<!-- right modules -->
<g font-size="14" font-weight="bold">
<rect x="560" y="80" width="170" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="645" y="108" text-anchor="middle" fill="#3C3489">MAX98357A amp</text>
<text x="645" y="126" text-anchor="middle" font-size="11" font-weight="normal" fill="#534AB7">under the plate</text>
<text x="645" y="160" text-anchor="middle" font-size="11" font-weight="normal" fill="#534AB7">VIN 5V, GAIN/SD open</text>
<rect x="560" y="300" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="645" y="324" text-anchor="middle" fill="#3C3489">INMP441 mic</text>
<text x="645" y="342" text-anchor="middle" font-size="11" font-weight="normal" fill="#534AB7">lid pocket, L/R to GND</text>
<rect x="560" y="200" width="170" height="44" rx="8" fill="#FAECE7" stroke="#993C1D"/><text x="645" y="227" text-anchor="middle" fill="#712B13">Speaker 2040</text>
<rect x="560" y="410" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/><text x="645" y="437" text-anchor="middle" fill="#0C447C">LiPo 503040 (side bay)</text>
</g>
<!-- I2C -->
<g stroke="#1D9E75" stroke-width="2" fill="none">
<path d="M200 86 H250 V100 H290"/><path d="M200 102 H240 V130 H290"/>
<path d="M200 158 H250 V100"/><path d="M200 172 H240 V130"/>
</g>
<circle cx="250" cy="100" r="4" fill="#111"/><circle cx="240" cy="130" r="4" fill="#111"/>
<path d="M200 190 H260 V180 H290" stroke="#EF9F27" stroke-width="2" fill="none"/>
<path d="M200 386 H290 V380" stroke="#EF9F27" stroke-width="2" fill="none"/>
<!-- I2S -->
<g stroke="#7F77DD" stroke-width="2" fill="none">
<path d="M470 100 H520 V96 H560"/><path d="M470 130 H530 V116 H560"/><path d="M470 160 H560"/>
<path d="M520 100 V318 H560"/><path d="M530 130 V332 H560"/><path d="M470 330 H510 V346 H560"/>
</g>
<circle cx="520" cy="100" r="4" fill="#111"/><circle cx="530" cy="130" r="4" fill="#111"/>
<path d="M645 180 V200" stroke="#D85A30" stroke-width="3" fill="none"/>
<path d="M470 430 H560" stroke="#185FA5" stroke-width="2.5" fill="none"/>
<!-- legend -->
<g font-size="12" fill="#444441">
<circle cx="40" cy="490" r="4" fill="#111"/><text x="52" y="494">Dupont Y-splitter (one pin, two modules): SDA, SCL, BCLK, WS</text>
<rect x="34" y="508" width="14" height="3" fill="#1D9E75"/><text x="56" y="514">I²C</text>
<rect x="94" y="508" width="14" height="3" fill="#7F77DD"/><text x="116" y="514">I²S</text>
<rect x="154" y="508" width="14" height="3" fill="#EF9F27"/><text x="176" y="514">signal</text>
<text x="240" y="514">Every module also gets VCC and GND from its own pin trio (3V3; the amp uses 5V).</text>
</g>
</svg>
